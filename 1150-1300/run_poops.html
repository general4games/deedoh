<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080512">
<title>الجنرال للألعاب الإلكترونية — PS4 Poops</title>

<style>
:root {
  --bg-main: #05030a;
  --bg-secondary: #090611;
  --panel-bg: #100a1c;
  --purple: #8b24ec;
  --purple-dark: #4e0b91;
  --cyan: #00c3ff;
  --text-main: #ffffff;
  --text-muted: #9da7c4;
  --ok: #48e28a;
  --danger: #ff5f67;
  --warning: #ffd477;
  --shadow: 0 10px 28px rgba(0,0,0,.48);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  color: var(--text-main);
  font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(circle at 50% 0%, rgba(139,36,236,.28), transparent 35%),
    radial-gradient(circle at 0% 70%, rgba(0,195,255,.10), transparent 30%),
    linear-gradient(135deg, #030208 0%, #090512 48%, #04070d 100%);
  background-attachment: fixed;
}

/* شبكة الخلفية */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,195,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,36,236,.025) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: -3;
}

/* الشعار المائي */
body::after {
  content: "";
  position: fixed;
  width: 650px;
  height: 650px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: url("../shop-logo.png") center/contain no-repeat;
  opacity: .025;
  pointer-events: none;
  z-index: -2;
}

/* الشريط العلوي */
.top {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 10px 28px;
  border-bottom: 1px solid rgba(0,195,255,.22);
  background: linear-gradient(90deg, rgba(5,3,10,.97), rgba(15,7,28,.97), rgba(5,5,14,.97));
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 6px 20px rgba(0,0,0,.35);
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.store-logo {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  background: #090813;
  display: grid;
  place-items: center;
  overflow: hidden;
  box-shadow: 0 0 12px rgba(0,195,255,.25);
}

.store-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand-text b {
  font-size: 17px;
  display: block;
  line-height: 1.25;
  color: #fff;
}

.brand-text small {
  display: block;
  color: var(--cyan);
  font-size: 10px;
  margin-top: 3px;
  font-weight: 700;
}

.top-actions {
  display: flex;
  gap: 8px;
}

.txtbtn {
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(139,36,236,.4);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}

.txtbtn:hover {
  background: rgba(139,36,236,.20);
  border-color: var(--cyan);
}

.txtbtn.whatsapp {
  background: rgba(0,195,255,.07);
  border-color: rgba(0,195,255,.6);
  color: var(--cyan);
}

/* الحاوية الرئيسية */
#wrap {
  padding: 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
}

.section-title {
  text-align: center;
  margin-bottom: 16px;
}

.section-title h1 {
  margin: 0;
  font-size: 24px;
  color: #fff;
}

.section-title span {
  color: var(--cyan);
  font-size: 13px;
  font-weight: 700;
  display: block;
  margin-top: 4px;
}

#state {
  font-size: 18px;
  font-weight: 800;
  margin: 0 0 14px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-align: center;
}

/* الشاشة البرمجية */
#out {
  white-space: pre-wrap;
  font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
  background: rgba(5, 3, 10, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(139, 36, 236, 0.35);
  border-radius: 14px;
  padding: 18px 20px;
  flex: 1;
  min-height: 380px;
  max-height: calc(100vh - 280px);
  overflow-y: auto;
  color: #a3b2c2;
  box-shadow: var(--shadow);
  direction: ltr;
  text-align: left;
}

/* ألوان نصوص الحالة */
.ok { color: var(--ok) !important; }
.bad { color: var(--danger) !important; text-shadow: 0 0 10px rgba(255, 95, 103, 0.4); }
.warn { color: var(--warning) !important; text-shadow: 0 0 10px rgba(255, 212, 119, 0.4); }

/* الفوتر */
footer {
  text-align: center;
  color: var(--text-muted);
  font-size: 12px;
  padding: 22px 20px;
  border-top: 1px solid rgba(139,36,236,.20);
  margin-top: auto;
  background: rgba(4,2,9,.55);
}

.footer-name { color: var(--cyan); font-weight: 800; }
.footer-address { display: block; margin-top: 5px; font-size: 11px; }

@media(max-width: 650px) {
  .top { padding: 9px 12px; }
  .brand-text b { font-size: 14px; }
  #wrap { padding: 14px; width: 100%; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="top">
  <div class="brand">
    <div class="store-logo">
      <img src="../shop-logo.png" alt="الجنرال" onerror="this.style.display='none'">
    </div>
    <div class="brand-text">
      <b>الجنرال للألعاب الإلكترونية</b>
      <small>درنة — شارع الرفاعي</small>
    </div>
  </div>

  <div class="top-actions">
    <a href="../index.html" class="txtbtn">← الرئيسية</a>
    <a href="https://wa.me/218918846443" target="_blank" class="txtbtn whatsapp">واتساب المحل</a>
  </div>
</header>

<!-- MAIN WRAPPER -->
<div id="wrap">
  <div class="section-title">
    <h1>سلسلة ثغرة Poops</h1>
    <span>إصدارات PS4: 12.50 — 13.00</span>
  </div>

  <div id="state" class="warn">loading poops chain...</div>
  <div id="out"></div>
</div>

<!-- FOOTER -->
<footer>
  <b class="footer-name">الجنرال للألعاب الإلكترونية — General Gaming Shop</b>
  <span class="footer-address">العنوان: درنة — شارع الرفاعي | هاتف / واتساب: 0918846443</span>
</footer>

<!-- SCRIPT LOGIC (EXACTLY UNCHANGED) -->
<script type="module" src="./chain_poops.js"></script>

<audio id="bg-music" loop autoplay preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
  var music = document.getElementById("bg-music");
  music.play().catch(function() {
    window.addEventListener("click", function() { music.play(); }, { once: true });
    window.addEventListener("keydown", function() { music.play(); }, { once: true });
  });
</script>

</body>
</html>
