<script>
// Register SW for modern browsers; PS4 will use AppCache because of manifest attribute
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .then(() => console.log('Service Worker registered'))
    .catch(() => console.log('Service Worker registration failed'));

</script>

<style>
:root {
  --bg-main: #05030a;
  --bg-secondary: #090611;
  --panel-bg: #100a1c;
  --purple: #8b24ec;
  --purple-dark: #4e0b91;

  --text-muted: #9da7c4;
  --ok: #48e28a;
  --danger: #ff5f67;
  --warning: #ffd477;
  --shadow: 0 10px 28px rgba(0,0,0,.48);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  color: var(--text-main);
  font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(circle at 50% 0%, rgba(139,36,236,.28), transparent 35%),
    radial-gradient(circle at 0% 70%, rgba(0,195,255,.10), transparent 30%),
    linear-gradient(135deg, #030208 0%, #090512 48%, #04070d 100%);
  background-attachment: fixed;
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="top">
  <div class="brand">
    <div class="store-logo">
      <img src="../shop-logo.png" alt="الجنرال" onerror="this.style.display='none'">

    </div>
  </div>

  <div class="top-actions">
    <a href="../index.html" class="txtbtn">← الرئيسية</a>
    <a href="https://wa.me/218918846443" target="_blank" class="txtbtn whatsapp">واتساب المحل</a>
  </div>
</header>

<!-- MAIN WRAPPER -->
<div id="wrap">
  <div class="section-title">
    <h1>منظومة تشغيل الثغرة</h1>
    <span>إصدارات PS4: 10.00 — 11.02</span>
  </div>

  <pre id="console">Caching offline files... 0%</pre>
</div>

<footer>
  <b class="footer-name">الجنرال للألعاب الإلكترونية — General Gaming Shop</b>
  <span class="footer-address">العنوان: درنة — شارع الرفاعي | هاتف / واتساب: 0918846443</span>
</footer>

<script>
  var scriptsLoaded = false;
  function triggerScripts() {
    if (scriptsLoaded) return;
    scriptsLoaded = true;
    var consoleLog = document.getElementById('console');
    if (consoleLog) consoleLog.innerText += "\nLoading main.js & script.js...";

    var s1 = document.createElement('script');
    s1.src = 'src/main.js';
    s1.onload = function() {
      var s2 = document.createElement('script');
      s2.src = 'includes/script.js';
      document.body.appendChild(s2);
    };
    document.body.appendChild(s1);
  }

  if (window.applicationCache) {
    var appCache = window.applicationCache;
    var consoleLog = document.getElementById('console');

    appCache.addEventListener('progress', function(e) {
      if (e.lengthComputable && consoleLog) {
        var percent = Math.round((e.loaded / e.total) * 100);
        consoleLog.innerText = "Caching offline files... " + percent + "%";
      }
    }, false);

    appCache.addEventListener('cached', function() { triggerScripts(); }, false);
    appCache.addEventListener('noupdate', function() { triggerScripts(); }, false);
    appCache.addEventListener('error', function() { triggerScripts(); }, false);
    setTimeout(function() { if (!scriptsLoaded) triggerScripts(); }, 3000);
  } else {
    triggerScripts();
  }
</script>

</body>
</html>
